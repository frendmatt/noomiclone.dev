<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NoomiClone</title>
  <meta name="description" content="NoomiClone, a physics-based ragdoll gymnastics game for Android and iOS.">
  <style>
    :root { --bg: #f7f7f9; --fg: #1d1d24; --muted: #5d5d6b; --accent: #c8102e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14141a; --fg: #ececf1; --muted: #a3a3b2; --accent: #ff5a6e; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg);
           font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 64px 16px; }
    h1 { font-size: 2.2rem; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    ul { list-style: none; padding: 0; margin: 0 0 32px; }
    li { margin: 0 0 12px; }
    a { color: var(--accent); font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { font-size: 0.9rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>NoomiClone</h1>
    <p>A physics-based ragdoll gymnastics game: swing on bars, flip off springboards and dive into the pool.</p>
    <ul>
      <li><a href="https://play.google.com/store/apps/details?id=com.JamesWest.NoomiClone">Get it on Google Play</a></li>
      <li><a href="https://apps.apple.com/us/app/noomiclone/id1546690510">Download on the App Store</a></li>
      <li><a href="https://frendmatt.github.io/noomiclone-privacy/">Privacy policy</a></li>
    </ul>
    <footer>Contact: <a href="mailto:Noomiclonedev@gmail.com">Noomiclonedev@gmail.com</a></footer>
  </main>
</body>
</html>
