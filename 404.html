  document.getElementById("b-play").href = w.play;
  document.getElementById("i-play").src = "/img/badges/google-play-" + lang + ".png";
  document.getElementById("i-play").alt = w.play_alt;
  document.getElementById("i-apple").src = "/img/badges/app-store-" + lang + ".svg";
  document.getElementById("i-apple").alt = w.apple_alt;
  // A room's link (live rooms R11): /r/CODE, the code as the game makes it (letters and digits, 4 to 12).
  var room = location.pathname.match(/^\/r\/([^\/]+)\/?$/i);
  var roomCode = null;
  if (room) {
    try { roomCode = decodeURIComponent(room[1]).replace(/[-\s]/g, "").toUpperCase(); } catch (err) { roomCode = null; }
    if (roomCode && !/^[A-Z0-9]{4,12}$/.test(roomCode)) roomCode = null;
  }
  if (roomCode) {
    document.title = w.r_page + " " + roomCode;
    set("t-title", w.r_title); set("t-lede", w.r_lede); set("open", w.r_open); set("t-help", w.r_help);
    set("code", roomCode);
    document.getElementById("open").href = "noomiclone://r/" + roomCode;
    document.getElementById("copy").onclick = function () {
      var button = this;
      function done() { button.textContent = w.copied; }
      if (navigator.clipboard) navigator.clipboard.writeText(roomCode).then(done, function () {});
      else done();
    };
    document.getElementById("map").hidden = false;
    return;
  }
  var match = location.pathname.match(/^\/m\/([^\/]+)\/?$/i);
  var code = window.__mapCode || (match ? parse(match[1]) : null);
  if (code) {
    var shown = code.slice(0, 4) + "-" + code.slice(4);
    document.title = w.page + " " + shown;
    set("code", shown);
    document.getElementById("open").href = "noomiclone://m/" + code;
    document.getElementById("copy").onclick = function () {
      var button = this;
      function done() { button.textContent = w.copied; }
      if (navigator.clipboard) navigator.clipboard.writeText(shown).then(done, function () {});
      else done();
    };
    document.getElementById("map").hidden = false;
  } else {
    document.getElementById("missing").hidden = false;
  }
})();
</script>
</body>
</html>
